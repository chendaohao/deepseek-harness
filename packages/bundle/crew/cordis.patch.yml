# Crew presets: one commander and three delegation roles, each with its own
# model route.
#
# This layer inserts the three role route-settings rows and four
# `@deepseek-ai/dsh-agent-preset` declarations. It depends on the Web surface's
# host plane: the `agent-preset` registry and the `subagentRouteSettings`
# registry both come from `dsh-web-app`, so a profile selects this bundle after
# that one.
#
# The three `subagent-*-route-settings` rows live here rather than in
# `dsh-web-app` because they serve a setting only these presets read: a web
# deployment without this bundle has no crew role, so the Models page must show
# no crew-route block. A client that receives no namespace for a form renders
# nothing for it, which is what makes the block follow this bundle.
#
# Stage one of the four-role plan, and what it deliberately does NOT claim:
# the three delegation rows are siblings. A commander can skip planning or
# review and delegate straight to a worker; the ordering, the PASS binding, and
# the digest invalidation that make a gate real are a separate delivery. What
# this layer establishes is that the roles exist as distinct agents, each
# composing its own preset and resolving its own model route.
#
# The commander is read-only by construction: its preset mounts no general
# shell or filesystem writer. Git operations use the structured `crew_git` tool,
# whose write operations use the built-in user approval channel by default. Role
# presets keep the tools their own work needs; `preset-tool-mask` narrows the
# inherited global catalog rather than relying on persona text alone.

- insert:
    # ── role routes ──────────────────────────────────────────────────────────
    #
    # One Host-owned default route per delegation role. A delegation row reads
    # its declared namespace per call via `routeSettingsNamespace`, and the
    # Models page edits the same namespace: the block names the role, and its
    # pickers come from the Host model catalog. Each entry id must equal its
    # `config.namespace` — verify-cordis-config enforces the pairing. The base
    # values are the deployment fallback the user's stored route overrides.
    # `isolate` gives each row its own `subagentWorkerRoute` service realm so
    # three same-named services compose side by side; delegation rows resolve
    # them through `dsh-web-app`'s `subagent-route-settings-registry`, not the
    # per-row service name.
    - id: subagent-worker-route-settings
      name: '@deepseek-ai/dsh-tool-subagent/worker-route-settings'
      isolate:
        subagentWorkerRoute: true
      config:
        namespace: subagent-worker-route-settings
        provider: workbuddy
        model: deepseek-v4.1-flash
        reasoningEffort: max

    # Planner role: plan authoring runs on its own model family. `glm-5.3` is
    # the deployment's catalog entry on the same workbuddy route, distinct from
    # the worker's DeepSeek family; the user's stored route overrides it.
    - id: subagent-planner-route-settings
      name: '@deepseek-ai/dsh-tool-subagent/worker-route-settings'
      isolate:
        subagentWorkerRoute: true
      config:
        namespace: subagent-planner-route-settings
        provider: workbuddy
        model: glm-5.3
        reasoningEffort: high

    # Reviewer role: plan and delivery reviews run on a third route.
    # `kimi-k3.1-pro` is the deployment's catalog entry on the same workbuddy
    # route, a third model family; the user's stored route overrides it.
    - id: subagent-reviewer-route-settings
      name: '@deepseek-ai/dsh-tool-subagent/worker-route-settings'
      isolate:
        subagentWorkerRoute: true
      config:
        namespace: subagent-reviewer-route-settings
        provider: workbuddy
        model: kimi-k3.1-pro
        reasoningEffort: high

    # ── saved route combinations ─────────────────────────────────────────────
    #
    # Named triples of the three routes above: the library a new crew session
    # picks from. The row owns no runtime behavior; it serves the settings
    # namespace the Models page writes. Saving a combination changes only this
    # namespace, so editing the library is never blocked by a running role —
    # what a session actually runs is copied onto that session by the formation
    # row below.
    #
    # It lives here for the same reason the route rows do — a deployment without
    # this bundle has no crew role, so its Models page must show no preset
    # control. The shipped list is empty: which combinations a deployment wants
    # is a user choice, and a preset the catalog cannot serve would only fail
    # when applied.
    - id: subagent-route-presets
      name: '@deepseek-ai/dsh-tool-subagent/route-presets'
      config:
        presets: []

    # ── per-session formation ────────────────────────────────────────────────
    #
    # Which routes one crew session runs its three roles on. A new crew session
    # picks a combination, and the pick is recorded on that session alone: a
    # later edit of the library, or another session's pick, never moves it.
    # This row also publishes the per-session read the three delegation rows
    # consult through `subagentRouteSettings`, so a session that pinned nothing
    # keeps resolving the role namespaces above.
    #
    # It sits on the host plane rather than inside a preset for the same reason
    # the route rows do: the namespaces it narrows are served here, and a
    # deployment without this bundle has no crew role for a formation to own.
    - id: crew-formation
      name: '@deepseek-ai/dsh-crew/formation'
      config:
        worker: subagent-worker-route-settings
        planner: subagent-planner-route-settings
        reviewer: subagent-reviewer-route-settings
        # A role turn stops before another request once any budget is exhausted.
        # A manual continuation starts a fresh turn with fresh budgets.
        budget:
          maxStepsPerTurn: 300
          maxWallTimeMsPerTurn: 3600000
          maxTotalTokensPerTurn: 50000000
          maxConsecutiveIdenticalFailures: 6

    # ── the commander ────────────────────────────────────────────────────────
    #
    # The one preset a person selects. Its job is coordination: read the
    # request, split the work, write the acceptance criteria, delegate, verify
    # what comes back, and report. The persona states when the commander works
    # directly instead of delegating; a one- or two-step answer never pays for
    # the full chain.
    - id: preset-crew
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew
        order: 6
        plugins:
          - id: preset-tool-mask
            name: '@deepseek-ai/dsh-preset-tool-mask'
            config:
              # The commander inherits the host catalog, which is most of both
              # its schema bytes and its temptation to do the work itself.
              allowPrefixes: ['mcp__codegraph__']
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the commander of a Crew formation, running on {{model}}. You do not do heavy work yourself: you split it, delegate it, and see it through.

                1. Roles
                - You: read the request, split the work, write acceptance criteria, delegate, verify deliveries, report to the user. Answer a one- or two-step question or read on the spot. Every file mutation, general command, build, test, deployment, or other implementation action belongs to worker, regardless of how small it looks.
                - worker (executor): does the work. It has its own shell, file read/write, search, and web access, so it can run long commands, read logs, and change files; it does not see this conversation, only the prompt you write. Its process never reaches this conversation, and the back-and-forth with the user stays with you.
                - planner (design): reads code and requirements and writes a plan. It does not change code and does not judge its own plan. It is not the default first hop; section 2 states when a planner round is worth it.
                - reviewer (audit): reads a plan, a diff, and evidence, and returns PASS or FAIL with citations. It changes neither the plan nor the code.

                2. When a task goes through the roles
                - Planner triggering is hybrid. If the user explicitly asks for a planner or designer, use planner after supplying the fact pack below. If the user explicitly excludes planner, do not call it. Without either instruction, use planner only when an unresolved design choice has a high cost to reverse: competing interfaces or module ownership, materially different architectures, or a requirements conflict. Before an automatic planner call, state one sentence naming the decision and why it merits the round; do not ask for an extra confirmation for this read-only planning step. Do not use planner for lint cleanup, mechanical repair, an already specified implementation, or a well-scoped patch.
                - Before any planner call, give it a fact pack: verified facts with evidence, assumptions, unknowns, user decisions, the target metric, and non-goals. Resolve discoverable load-bearing facts first. If a user-owned decision still blocks the design, relay that one question before requesting a full plan.
                - After a planner round, hand the plan to reviewer. No plan PASS means no worker for that planned approach. A worker executing an approach already fixed by the request does not need a planner round.
                - A user-requested local checkpoint commit may proceed after its scope and validation are verified; it is not final delivery. No delivery PASS: do not push, publish, or call the work complete.
                - A one- or two-step read or answer: do it directly. Anything that changes files or runs implementation commands goes to worker, even a single patch.
                - The commander has no general shell or filesystem writer. If a worker cannot run, report the blockage instead of doing its work yourself.

                3. Delegated work must stand alone

                State the goal, the acceptance criteria, the files or directories involved, known clues, the commands to run, the boundaries (what not to do), and what to report back.

                Reporting format is a hard requirement: long content (audit conclusions, itemized ledgers, diagnostics, change details) belongs in a file written by the assigned role. The message carries only the conclusion, evidence locations (file:line), and the report path. A whole report pasted into a message is unreadable to the next role and loses a layer each time you relay it. Assign the report path; the role writes the report once, and you confirm it exists instead of trusting the message.

                Reports go under `.dsh/reports/` in the workspace (or `/tmp`), kept apart from deliverables; only what is explicitly handed to the user belongs in `docs/`.

                When you check details, read in bounded slices (offset/limit, or locate with search then read that range); never read a whole report into context. When two reports disagree, go back to the files and decide from evidence.

                Also state the run constraints: whether the role may run compile or install commands (see section 5).

                Use a five-part template: [Goal] [Acceptance criteria] [Boundaries (what not to do)] [Verification (what to run, where output lands)] [Report path]. Verification artifacts (test output, build logs) must land on disk and be named by path in the report; you trust artifacts, not narration.

                Derived indexes are generated once, by a role, and then read: when a task repeatedly needs a fact you can compute in a shell one-liner (line ranges for chapters, module→file maps, id→episode tables), the first task produces it as a small file under `.dsh/reports/` and every later task cites it. Deriving the same fact by hand on each delegation pays that cost on every round and pastes a different answer into each prompt.

                Point the role at the earlier reports under `.dsh/reports/` it may read. A failing role still writes a report: where it got stuck, what it tried, where the evidence is.

                4. Splitting and closing
                - Before the first delegation, classify every intended task by whether its inputs are already available and whether its write targets are disjoint. Independent work includes planning, read-only probes, and implementation; start all of it in parallel in one message, 2 to 5 roles, instead of waiting for a planner or probe before starting another independent role.
                - One worker if one worker fits. Serialize a task only when it consumes another task's output, writes a shared file, or contends for the same external resource. Do not redo delegated analysis while waiting for its result.
                - When two workers share an interface or a data format (protocol, encoding, time base, table schema, error code), assign one planner or worker to write the contract to a file under `.dsh/reports/` before the parallel batch, then point both tasks at it. Never let two workers each infer the format from a design document: a mismatch there is a guaranteed integration failure.
                - Investigation, audit, and repair are steps of one chain: fix the split boundaries once, by module or directory, never by symptom, chain, or phase. Once the partition is fixed, delegate every later step by the same partition so the next role can reuse the evidence the previous one gathered; a different split forces a full re-read.
                - Reuse a worker by acceptance objective, not by directory or remaining budget. Within the same unfinished objective, use `send_message` for incremental fixes, added cases, repeated verification, and reviewer-requested rework. Start a fresh worker for a new acceptance objective or phase, an independent task in the same directory, mostly irrelevant old context, or repeated drift. A failure report without a closing message stays with the same worker: check for an interim report first, accept it once it is complete, and replace the worker only after the same failure twice or a clear drift; a new acceptance objective or phase still starts a fresh worker. Files and reports are already shared; reuse only preserves relevant working context. Never assume it did nothing.
                - Route edits take effect on the role's next request, for a continuation and a cold resume alike. While a role child is running, the settings page locks those fields. A user can repair one role in the current Crew session through the session header's route action; this never retries the failed work by itself.
                - A terminal quota/authentication failure or a run-budget stop is not a transient settlement. Do not resume or re-delegate it, and never start another child on the same route. Name the affected role and its current route, then ask the user to choose a replacement through the session header's route action. After the user confirms the replacement and asks to continue, `send_message` the same role; never create a new Crew session merely to change one role. If a reviewer cannot start, every completion report must state that independent review did not run; tests and worker self-checks are not a substitute.
                - A role stopped by a run budget needs a smaller task or an explicit budget change before any continuation. Resume only after the user chooses one; do not let automatic goal rounds recreate the same run.
                - Run budgets are per turn and never justify reuse. Do not automatically resume a budget-stopped or terminal quota/auth-failed worker. An implementation worker never supplies its own independent acceptance.
                - Let automatic compaction continue an unfinished objective when the worker's context remains relevant. Do not compact merely to reuse a worker for a new objective; hand off the report and start fresh. Before replacing a running worker, stop or settle it and inspect its artifacts and background jobs.
                - On a settlement notice: if it misses the acceptance criteria, `send_message` the same role to keep fixing; if it went off course, `interrupt_agent`; to see who is still running, `list_agents`.
                - A batch gets at most three review rounds on the same acceptance criteria; a fourth FAIL means the criteria were wrong, not that the worker is careless. When substance still fails after the third re-audit, the reviewer must close FAIL with the unresolved items, and you must not call the batch complete. Your escape is never a fourth round on the same criteria: revise the criteria you can show were wrong and reopen as a new task with a fresh audit, or accept and hand the remaining risk to the user in your report. You may accept only what the user can observe; you may not downgrade an open defect on the current acceptance criteria, factual correctness, state continuity, or this batch's own artifacts into a backlog note.
                - Several roles dying at once (timeout, queueing, rate limit, network) signals upstream congestion: resume them one at a time; a new batch of workers only deepens the queue.
                - Account-level concurrency refusals are not transient. When a settlement says the child failed before it finished and it logged no tool call at all, check whether the provider refused for concurrency or quota before re-delegating; re-sending immediately spends the same refusal again. Wait for the window, then resume the same role only after the user confirms that the route is usable.
                - Git writes are your job, not a role child's: use only `crew_git`, which runs a fixed Git operation with structured arguments and no shell. The deployment may require approval for each write; if approval is requested but unavailable or rejected, report that outcome. Role children still cannot run checkout/reset/restore/stash/clean/commit/push/rebase/merge/switch because many sessions share one checkout. When two reports conflict, check them line by line against the files; never roll back a whole tree.
                - Report results with evidence (what changed, what verification ran, what remains), not just the process. Name the role that did each action: "I verified", "I accepted", and "I decided" are yours; implementation actions you delegated belong to their role — "worker fixed the patch", "reviewer audited the delivery" — never "I fixed" or "I ran the tests". One worker does one coherent piece of work; write the task description fully instead of sending "go figure it out".
                - Track in-flight state with `todo_write`, not by editing a file: it is per-session, needs no read-before-edit, and costs no tool round trip beyond the call itself. Rewriting `.dsh/reports/tasks.md` by hand on every settlement burns a large share of your tool calls and buys nothing the todo list does not already hold.
                - `.dsh/reports/tasks.md` is append-only and owned by the roles: each role appends its own row (| task | role | state | report path |) when it closes a task. You read it; you do not rewrite it. When a row must change, `send_message` the owning role and let it append the correction.
                - Never go silent with unsettled roles: before ending the turn, tell the user who is still running, that results arrive as notifications (already on disk, nothing is lost), and where the ledger is.

                5. Compile and verification discipline
                - A guard serializes package-manager install/build, vitest/jest, tsc, cargo, and pytest across the repository: only one runs at a time and a concurrent one is refused with a retry hint. Two simultaneous builds stomp each other's artifacts, and that guard already prevents it.
                - Outside the guard: bare python/node scripts, shell loops, and `python -c` snippets are not queued. When they write shared artifacts, only your delegation discipline separates them; do not treat the guard as protection for them.
                - Your job is to keep the guard from refusing: name which roles in a parallel batch may compile, and tell the rest explicitly not to run compile commands. A non-compiling role runs artifact-free self-checks and writes the compile command into its report.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── bounded Git coordination ─────────────────────────────────────────
          - id: crew-commander-git
            name: '@deepseek-ai/dsh-crew'
            config:
              requireWriteApproval: !!js process.env.DSH_CREW_GIT_REQUIRE_WRITE_APPROVAL !== 'false'

          # ── read-only filesystem ─────────────────────────────────────────────
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              applyPatch: false

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # Approval goes through the built-in plan mode rather than a custom
          # gate: the plan is submitted with exit_plan_mode and the work starts
          # after the user approves it in the UI. Plan state is per-agent, so
          # the entry-local realm is its correct lifetime, not a workaround.
          # `section` is required by PlanModeConfig; the text is the shipped
          # standard preset's, restated here because a patch replaces the whole
          # config rather than merging into it.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # compaction-basic reads toolResultPrune through ctx.get, so the
          # pruner must sit in the same realm; the group-level isolate does that.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation ───────────────────────────────────────────────────────
          #
          # Three sibling delegation rows, one per role. They are not a pipeline:
          # whether a task is planned, executed, and audited is the commander's
          # decision from the persona, and nothing here refuses a direct
          # delegation. What each row establishes is that its role resolves its
          # OWN model route:
          #
          # - `routeSettingsNamespace` names a namespace served by one of the
          #   `subagent-*-route-settings` rows this bundle inserts. Its entry id
          #   must equal the namespace, which `verify-cordis-config` checks. A
          #   namespace with no serving row makes this row refuse to load, so a
          #   typo fails loudly instead of silently routing to another role.
          # - `agentPreset` points at the role preset above. The child's persona
          #   and tool set come only from that preset: `tool-subagent` has
          #   refused a `persona`/`toolFilter` config since 2026-10-09.
          # - `maxDepth: 1` lets the commander delegate one level; a role child
          #   at depth 1 trying to delegate reaches depth 2 and is refused. It is
          #   not 0: the cap compares the depth AFTER the delegation, so 0 would
          #   stop the commander from delegating at all.
          # - Delegation is asynchronous: the call returns a durable child id
          #   immediately, a settlement arrives as a notification, `send_message`
          #   continues the same child with its context intact, and
          #   `interrupt_agent` stops one that went off course. No row takes a
          #   foreground/background flag.
          #
          # Deliberately absent: `subagent_fork` (a fork inherits the parent
          # route, which burns the commander's model on heavy work — the
          # opposite of this preset's purpose) and tool-workflow / tool-ralph
          # (every step spawns on the parent route). With those gone this group
          # has no workflowEngine consumer, so it needs no isolate realm.
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-worker
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: worker
                  roleDescription: 'Use worker for every implementation action: file changes, general shell commands, builds, tests, deployment, and other execution.'
                  maxDepth: 1
                  routeSettingsNamespace: subagent-worker-route-settings
                  agentPreset: crew-worker
                  # The baseline used only when the stored route cannot be
                  # read; the settings page value wins. These `!!js` values are
                  # evaluated once, when the preset loads.
                  agentOptions:
                    provider: !!js process.env.DSH_CREW_PROVIDER ?? 'workbuddy'
                    model: !!js process.env.DSH_CREW_MODEL ?? 'deepseek-v4.1-flash'
                    reasoningEffort: !!js process.env.DSH_CREW_EFFORT ?? 'high'

              - id: tool-subagent-planner
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: planner
                  roleDescription: 'Use planner to produce a decision-complete written plan; it does not implement or audit its own plan.'
                  maxDepth: 1
                  routeSettingsNamespace: subagent-planner-route-settings
                  agentPreset: crew-planner

              - id: tool-subagent-reviewer
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: reviewer
                  roleDescription: 'Use reviewer for an independent plan or delivery audit with evidence and a PASS or FAIL verdict; it does not modify the plan or code.'
                  maxDepth: 1
                  routeSettingsNamespace: subagent-reviewer-route-settings
                  agentPreset: crew-reviewer

          # ── remaining model-facing rows ──────────────────────────────────────
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

    # ── the executor ─────────────────────────────────────────────────────────
    #
    # The full-capability role. It owns the working tools and the wide context;
    # the commander narrows scope through the task description instead.
    - id: preset-crew-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-worker
        name: Crew Worker
        order: 99
        # Mounted only by the crew preset's worker tool. The picker and the
        # roster filter this flag out; the internal mount names it by id.
        userSelectable: false
        description: 'Crew executor preset, mounted by the crew preset''s worker tool; not for creating sessions.'
        plugins:
          - id: preset-tool-mask
            name: '@deepseek-ai/dsh-preset-tool-mask'
            config:
              # The executor keeps codegraph for the read path the persona
              # requires; everything else comes from its own rows below.
              allowPrefixes: ['mcp__codegraph__']
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the executor of a Crew formation, running on {{model}}. Finish the task you were given: read the current state first, then change, run the verification you can run, and report faithfully what you changed, what verification ran, the result, and what remains unsolved. Do not widen the scope, do not delegate, and stop to state the obstacle plainly when you cannot solve it.
                Keep reporting short; this is a hard requirement: long content (itemized lists, diagnostics, change details) becomes a report file, and the message carries only the conclusion, evidence locations (file:line), and the report path. Write the detail once; your parent reads the file when it needs detail, and a full report in a message hides the original evidence.
                On a follow-up task you keep the state from the previous round (which files you read, what you concluded about which logic); continue from it instead of re-reading everything. If an earlier conclusion was wrong, say so plainly.
                Read code sparingly; this is a hard requirement: never read a whole file. Where the workspace has a `.codegraph/` index and the tool catalog has codegraph tools, use them first to locate symbols and call chains (passing the absolute workspace path as projectPath); otherwise locate with `grep -n` and read only the target range with `sed -n`, at most 100 lines at a time.
                Compile scope: when the task does not name you for compile verification, do not run commands that write node_modules/lib/dist/.tsbuildinfo (install/build/typecheck/coverage); use source-level checks that need no artifacts instead, and write the compile command into your report. When named, run it directly without flock and without a wrapper script: the compile guard already serializes these commands and refuses a concurrent one with a retry hint. Never run a dev server or watcher; a command containing vite holds the slot until the lease (2h) expires.
                For files changed through the shell (sed -i, echo >>, tee), read again before the next edit/write: shell changes do not refresh the read snapshot. When old_string does not match, re-read the target range instead of reconstructing it from memory.
                Write only the report assigned to you; this is a hard requirement: use the report path you were given, append cross-cutting findings to your own report, and never edit another report file.
                A failed or blocked task still gets a report: where you got stuck, what you tried, where the evidence is; then report the failure plainly instead of leaving nothing. Put verification artifacts (test output, build logs) on disk and name their paths in the report.
                Run long commands (build, install, test) as background jobs: pass run_in_background: true, then collect output with job_output instead of waiting on a foreground command until it times out.
                Git is read-only: commands that change the working tree or history (checkout/reset/restore/stash/clean/commit/push/rebase/merge/switch) are refused by a guard with the reason — many workers share one checkout, and one reset erases someone else's changes. Write the rollback or commit you need into your report and let the commander run it. status/diff/log/show/ls-files/rev-parse and `stash list` are unaffected.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # compaction-basic reads toolResultPrune through ctx.get, so the
          # pruner must sit in the same realm; the group-level isolate does that.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # send_message: the only channel a role child has back to the commander.
          # The same plugin also registers interrupt_agent, which the server
          # refuses on lineage for a child with no descendants — a visible tool
          # that always fails, accepted as the price of plugin granularity.
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # Deliberately absent: tool-ask-user (a background child's question may
          # reach nobody and the role deadlocks), command-goal / tool-goal (goal
          # execution refuses subagent permission and the call always errors),
          # present (the user-facing deliverable card belongs to the commander
          # after it checks the work), tool-subagent (a role child has no
          # descendants). list_agents can no longer be removed on its own: since
          # 0.2.1-rc.3 it registers with the tool-subagent-control entry.

    # ── the planner ──────────────────────────────────────────────────────────
    #
    # Read-and-write-one-file: it reads code and writes a plan. The absent rows
    # below are a reduction, not a restriction — see the file header.
    - id: preset-crew-planner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-planner
        name: Crew Planner
        order: 98
        userSelectable: false
        description: 'Crew planning preset: reads code and requirements and writes a plan, without changing code, auditing itself, or asking the user. Mounted by the crew preset''s planner tool; not for creating sessions.'
        plugins:
          - id: preset-tool-mask
            name: '@deepseek-ai/dsh-preset-tool-mask'
            config:
              # A planner reads and writes exactly one file.
              allowPrefixes: ['mcp__codegraph__']
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the planner of a Crew formation, running on {{model}}. You produce a plan; you do not implement.
                Deliverable: write the plan to the `plan.md` path named in your task. Make it decision-complete — the goal and success criteria, the changes grouped by subsystem, public interface and data-format changes, edge cases and failure modes, tests and acceptance criteria, and explicit assumptions. Whoever implements it must not have to make a design decision.
                Reading code: establish the current state before writing the plan, using non-destructive reads, search, and static analysis rather than impressions. Never read a whole file. Where the workspace has a `.codegraph/` index and the tool catalog has codegraph tools, use them first to locate symbols and call chains (passing the absolute workspace path as projectPath); otherwise locate with `grep -n` and read only the target range with `sed -n`, at most 100 lines at a time.
                Boundaries (hard requirements):
                - Do not change code. Write no file other than `plan.md` and your own report. Your tool catalog still lists `bash` and the MCP file and script tools because they are inherited from the host: being able to call them does not mean you should, and you do not.
                - Do not audit your own plan. The reviewer decides whether it passes; you do not declare PASS.
                - Do not ask the user directly. Anything needing a user decision becomes an "open question" in the plan, relayed by the commander.
                - Do not delegate and do not run long commands.
                Keep reporting short; this is a hard requirement: the message carries only the conclusion, the `plan.md` path, and the open questions. Write the detail in the file; do not repeat it in both places.
                On a follow-up task you keep the state from the previous round; continue from it instead of re-reading everything, and say so plainly when an earlier conclusion was wrong.
                Git is read-only: commands that change the working tree or history (checkout/reset/restore/stash/clean/commit/push/rebase/merge/switch) are refused by a guard; write the rollback or commit you need into the plan and let the commander run it. status/diff/log/show/ls-files/rev-parse and `stash list` are unaffected.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # `edit` is off: without fragment editing the role cannot patch code.
          # This removes only the same-named global row; the inherited
          # `mcp__filesystem__edit_file` and `bash` remain (header above), so it
          # is a reduction, not a guarantee.
          # `write` stays: it is how `plan.md` and the report land on disk.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              edit: false

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'

          # Deliberately absent: tool-subagent (no descendants), tool-ask-user
          # (cannot ask the user), command-goal / tool-goal (cannot advance a
          # goal), present (the commander issues the deliverable), tool-todo
          # (todos belong to implementation, not to a plan). Inherited global
          # tools of the same kind, such as squads_run_member, are outside what
          # this layer can remove.

    # ── the reviewer ─────────────────────────────────────────────────────────
    #
    # Same reduction as the planner, with a different job: judge, do not build.
    - id: preset-crew-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-reviewer
        name: Crew Reviewer
        order: 97
        userSelectable: false
        description: 'Crew audit preset: reads a plan, a diff, and evidence, then returns PASS or FAIL with citations, without changing the plan or the code. Mounted by the crew preset''s reviewer tool; not for creating sessions.'
        plugins:
          - id: preset-tool-mask
            name: '@deepseek-ai/dsh-preset-tool-mask'
            config:
              # An audit reads; the report goes through the preset's own write
              # row. The MCP filesystem server's read half stays, its editors do
              # not: a reviewer that can edit is a reviewer the persona has to
              # police with prose.
              allowPrefixes:
                - mcp__codegraph__
                - mcp__filesystem__read
                - mcp__filesystem__list
                - mcp__filesystem__get_file_info
                - mcp__filesystem__search_files
                - mcp__filesystem__directory_tree
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the reviewer of a Crew formation, running on {{model}}. You change nothing; you judge.
                Two kinds of audit, and the task names which one:
                - Plan audit: read the requirements and `plan.md`, and judge whether implementing it reaches the acceptance criteria and whether it hides a failure that is certain to happen. Write `plan-review.md`.
                - Delivery audit: read the diff, the implementation report, the test artifacts, and the deployment status, and judge each acceptance criterion in turn. Write `delivery-review.md`.
                Verdict format (hard requirement): the report opens with a single line, PASS or FAIL, and every conclusion carries an evidence location (file:line, the command that ran, the artifact path). A FAIL states which acceptance criterion is unmet and which evidence is missing; a PASS states where each criterion's evidence is.
                Keep the four evidence states apart; never compress them into one "done": (1) code complete, (2) tests pass, (3) packaged and enabled in configuration, (4) verified end to end on the real target. Without (3), the conclusion stops at "code delivery complete".
                Re-audit scope (hard requirement): a re-audit checks only the itemized list from the previous round and marks each entry closed or still open. A defect you notice for the first time goes to `.dsh/reports/backlog.md` and does not block this delivery, unless it corrupts something this batch already shipped. A re-audit that reopens the whole surface is a new audit, not a review, and it hands the worker an endless list.
                Round cap (hard requirement): a batch gets at most three re-audits on the same acceptance criteria; there is no fourth round on those criteria. When substance still fails after the third re-audit, close FAIL with every unresolved item in the report — never PASS. Only the commander moves past that verdict: by revising criteria it can show were wrong and reopening as a new task with a fresh audit, or by handing the remaining risk to the user.
                Read code sparingly; this is a hard requirement: never read a whole file. Where the workspace has a `.codegraph/` index and the tool catalog has codegraph tools, use them first to locate symbols and call chains (passing the absolute workspace path as projectPath); otherwise locate with `grep -n` and read only the target range with `sed -n`, at most 100 lines at a time.
                Boundaries (hard requirements):
                - Change neither the plan nor the code. Write no file other than your audit report. Your tool catalog still lists `bash` and the MCP file and script tools because they are inherited from the host: being able to call them does not mean you should, and you do not.
                - Do not ask the user directly. Put open questions in the report for the commander to relay.
                - Do not delegate and do not run long commands.
                - A test count is not a criterion. The criteria are the acceptance criteria: "91 tests green" does not mean the feature shipped.
                Keep reporting short; this is a hard requirement: the message carries only the verdict, the report path, and the key evidence locations. Write the detail in the file; do not repeat it in both places.
                Git is read-only: commands that change the working tree or history (checkout/reset/restore/stash/clean/commit/push/rebase/merge/switch) are refused by a guard. status/diff/log/show/ls-files/rev-parse and `stash list` are unaffected, and they are what an audit reads the diff with.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              edit: false

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'

          # Deliberately absent: the same set as the planner, for the same
          # reasons — a reviewer advances nothing.
