# Keyless fixture: the mock adapter serves the vision route; observation
# flows through the real vision-llm provider over the real LLM seam.
- id: vision-mock-llm
  name: './vision-mock-llm.ts'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: fs
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'
  config:
    dshHome: './.dsh-home'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: vision-llm
  name: '@deepseek-ai/dsh-vision-llm'
  config:
    provider: vision-route
    model: vision-model

- id: vision-bridge
  name: '@deepseek-ai/dsh-vision-bridge'

- id: tool-vision
  name: '@deepseek-ai/dsh-tool-vision'