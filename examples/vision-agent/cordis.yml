# Text-only routes can still see images: the vision bridge converts pasted
# images into text evidence, and the vision_observe tool reads local files.
# Configure a vision-capable route below (credentials resolve through the
# credential store at request time, never inlined).

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# The LLM seam. llm-pi-ai supplies the vision-capable route; llm-deepseek
# (or another text route) stays the main model.
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
        models:
          - id: gpt-4o-mini
            input: [text, image]

# Durable image bytes for read_image / vision_observe and the bridge.
- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

# The vision seam: provider validates the route at load, so llm-pi-ai must
# load first; the consumers (bridge + tool) load after the provider.
- id: vision-llm
  name: '@deepseek-ai/dsh-vision-llm'
  config:
    provider: openai
    model: gpt-4o-mini

- id: vision-bridge
  name: '@deepseek-ai/dsh-vision-bridge'

- id: tool-vision
  name: '@deepseek-ai/dsh-tool-vision'
